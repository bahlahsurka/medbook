name: Build Android APK

# WHY THIS EXISTS: the Android APK is built here, on GitHub's own runners —
# not locally, and not in the Claude Code sandbox that authored the
# Capacitor setup this workflow builds. That sandbox's egress policy blocks
# dl.google.com, which the Android SDK/build-tools download from, so a real
# .apk could never be produced there. GitHub-hosted runners have normal
# internet access, so this is the actual place the APK gets compiled.
#
# The app is configured in "remote URL" mode (see capacitor.config.ts) — the
# installed APK loads the live Vercel deployment directly, it does not ship
# a bundled copy of the web app. That means the `npm run build` step below
# produces a build/ folder that Capacitor still wants to exist (so
# `cap sync` has something to copy into the native project as an inert
# local fallback) but that content is never actually what a user sees, so
# the placeholder env values below are intentional, not a stand-in for real
# secrets — no Supabase/Gemini keys need to be configured for this workflow
# to work.

on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-android-apk.yml'

# Needed to create/update the GitHub Release below — the default
# GITHUB_TOKEN is read-only otherwise and the release step would 403.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @capacitor/cli@8 requires Node >=22 ("npx cap sync" fatals
          # otherwise) — this only ever showed up here, never in local
          # testing, because the sandbox that authored this workflow
          # happened to already be running Node 22.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (inert local fallback — see top-of-file comment)
        run: npm run build
        env:
          REACT_APP_SUPABASE_URL: https://placeholder.supabase.co
          REACT_APP_SUPABASE_ANON_KEY: placeholder-anon-key
          REACT_APP_GEMINI_API_KEY: placeholder-gemini-key

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # Debug-signed, not a Play Store release build — exactly what
      # "downloadable, sideloadable APK" calls for here. Installing it
      # requires enabling "install from unknown sources" for whichever app
      # (browser, file manager) opens the download on the Android device.
      #
      # Kept alongside the public Release below (not replaced by it): this
      # artifact is scoped to signed-in-CI-collaborators and expires after a
      # few months, useful for debugging a specific run; the Release is what
      # actually makes an unauthenticated "download from the website" link
      # possible at all, since Actions artifacts require a GitHub login to
      # download even on a public repo.
      - name: Upload APK (workflow-run artifact)
        uses: actions/upload-artifact@v4
        with:
          name: medbook-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A stable, public download link the website can hardcode (see
      # ANDROID_APK_URL in src/components/Sidebar.js) — a friendlier
      # filename than the Gradle-default app-debug.apk for whoever opens the
      # downloaded file on their phone.
      - name: Rename APK for the public download link
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/medbook.apk

      # Public release assets need no authentication to download on a public
      # repo — unlike the workflow-run artifact above, this is what the
      # website's "Get the Android App" link actually points at.
      # `apk-latest` is a fixed tag: this action updates that ONE release's
      # asset in place on every run rather than creating a new release each
      # time, so the download URL (.../releases/download/apk-latest/
      # medbook.apk) never changes and the website link never needs editing
      # for a new build to show up. `prerelease: true` because this is a
      # debug-signed build, not a versioned store release.
      - name: Publish to the rolling "apk-latest" GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "MedBook Android (latest build)"
          prerelease: true
          body: |
            Automatically rebuilt from ${{ github.sha }} (${{ github.event.head_commit.timestamp || 'manual run' }}).
            This asset is replaced in place on every build — the download link
            above never changes, so bookmark or share it directly.
          files: android/app/build/outputs/apk/debug/medbook.apk
